<!-- Top bar: logo + user info -->
<header class="navbar-wrapper">
  <div class="navbar-container">
    <div class="navbar-top">
      <div class="navbar-brand">
        <img src="assets/logo-ftn.png" alt="FTN Logo" class="brand-logo"/>
        <div class="brand-text">
          <span class="brand-title">Fédération Tunisienne</span>
          <span class="brand-subtitle">de Natation</span>
        </div>
      </div>
      <div class="navbar-user" *ngIf="isLoggedIn">
        <div class="user-info">
          <span class="user-name">{{ user?.firstName }} {{ user?.lastName }}</span>
          <span class="user-role">{{ user?.role }}</span>
        </div>
        <div class="user-avatar">
          <img [src]="'https://ui-avatars.com/api/?name=' + user?.firstName + '+' + user?.lastName + '&background=random&size=32&color=fff'" 
               class="rounded-circle shadow-sm" alt="Avatar">
        </div>
        <button class="logout-btn" (click)="logout()" title="Se déconnecter">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="navbar-user" *ngIf="!isLoggedIn">
        <a routerLink="/auth/login" class="btn btn-sm btn-outline-primary rounded-pill px-3">Connexion</a>
      </div>
    </div>

    <!-- Nav links -->
    <nav class="navbar-nav">
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">ACCUEIL</a>
        <a routerLink="/competitions" routerLinkActive="active" class="nav-link">COMPÉTITIONS</a>
        <div class="nav-dropdown">
          <a class="nav-link has-dropdown">NATATION COURSE <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
        </div>
        <div class="nav-dropdown">
          <a class="nav-link has-dropdown">WATER POLO <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
        </div>
        <div class="nav-dropdown">
          <a class="nav-link has-dropdown">FORMATION <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
        </div>
        <div class="nav-dropdown">
          <a class="nav-link has-dropdown">MON ESPACE <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
          <div class="dropdown-content">
            <a routerLink="/utilisateurs">Gestion Utilisateurs</a>
            <a routerLink="/licences">Gestion Licences</a>
            <a routerLink="/clubs">Gestion Clubs</a>
            <a routerLink="/mon-profil">Mon Profil</a>
          </div>
        </div>
        <a routerLink="/actualites" routerLinkActive="active" class="nav-link">ACTUALITÉS</a>
        <a routerLink="/contact" routerLinkActive="active" class="nav-link">CONTACT</a>
      </div>
    </nav>
  </div>
</header>
