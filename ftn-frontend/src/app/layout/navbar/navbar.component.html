<!-- Admin Bar (Only for Administrators) -->
<div class="admin-top-bar" *ngIf="isAdmin">
  <div class="admin-bar-container">
    <div class="admin-bar-left">
      <a routerLink="/admin" class="admin-bar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <span>Tableau de Bord Administration</span>
      </a>
    </div>
    <div class="admin-bar-right">
      <a routerLink="/admin/utilisateurs" class="admin-bar-link">Utilisateurs</a>
      <a routerLink="/admin/licences" class="admin-bar-link">Licences</a>
      <a routerLink="/admin/clubs" class="admin-bar-link">Clubs</a>
      <a routerLink="/admin/press" class="admin-bar-link">Presse</a>
      <span class="admin-badge">MODE ADMIN</span>
    </div>
  </div>
</div>

<!-- Top bar: logo + user info -->
<header class="navbar-wrapper" [class.navbar-wrapper--scrolled]="isScrolled">
  <div class="navbar-container">
    <div class="navbar-top">
      <div class="navbar-brand">
        <img src="assets/logo-ftn.png" alt="FTN Logo" class="brand-logo"/>
        <div class="brand-text">
          <span class="brand-title">Fédération Tunisienne</span>
          <span class="brand-subtitle">de Natation</span>
        </div>
      </div>
      <div class="navbar-user">
        <a *ngIf="!isLoggedIn" href="javascript:void(0)" (click)="handleConnexion()" class="btn btn-primary rounded-pill px-4 fw-bold">Connexion</a>
        <button *ngIf="isLoggedIn" type="button" class="user-profile-btn" (click)="handleConnexion()">
          <div class="user-info">
            <span class="user-name">{{ displayName }}</span>
            <span class="user-role">{{ userRoleLabel }}</span>
          </div>
          <img [src]="avatarUrl" class="user-avatar-img" alt="Avatar">
        </button>
        <button *ngIf="isLoggedIn" class="logout-btn ms-2" (click)="logout()" title="Se déconnecter">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
  <nav class="navbar-nav">
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">ACCUEIL</a>
      <div class="nav-dropdown">
        <a class="nav-link has-dropdown">COMPÉTITIONS <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
        <div class="dropdown-content">
          <a routerLink="/competitions">Compétitions</a>
          <a routerLink="/competitions/archives">Archives</a>
        </div>
      </div>
      <a routerLink="/clubs" routerLinkActive="active" class="nav-link">CLUBS</a>
      <div class="nav-dropdown">
        <a routerLink="/formations" routerLinkActive="active" class="nav-link has-dropdown">FORMATION <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
      </div>
      <div class="nav-dropdown">
        <a class="nav-link has-dropdown">CLASSEMENTS <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
        <div class="dropdown-content">
          <a routerLink="/classement">Classements</a>
          <a routerLink="/mes-performances">Mes Performances</a>
          <a routerLink="/records">Records</a>
        </div>
      </div>
      <a routerLink="/press/visitor" routerLinkActive="active" class="nav-link">ACTUALITÉS</a>
      <div class="nav-dropdown" *ngIf="isSwimmer">
        <a class="nav-link has-dropdown">MON ESPACE <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
        <div class="dropdown-content">
          <a routerLink="/espace-nageur/dashboard">Vue globale</a>
        </div>
      </div>
    </div>
  </nav>
</header>
