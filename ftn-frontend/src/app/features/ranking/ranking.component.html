<app-header></app-header>

<div class="container py-4">

  <h2 class="fw-bold mb-4">
    Classement National
  </h2>

  @if (loading()) {

    <div class="text-center">
      <div class="spinner-border text-primary"></div>
    </div>

  } @else {

    <table class="table table-hover">

      <thead>
      <tr>
        <th>Rang</th>
        <th>Nageur</th>
        <th>Temps</th>
      </tr>
      </thead>

      <tbody>

        @for (entry of ranking(); track entry.swimmerId) {

          <tr>

            <td>{{ entry.rank }}</td>

            <td>
              {{ entry.swimmerFirstName }}
              {{ entry.swimmerLastName }}
            </td>

            <td>
              {{ formatTime(entry.time) }}
            </td>

          </tr>
        }

      </tbody>

    </table>
  }

</div>
