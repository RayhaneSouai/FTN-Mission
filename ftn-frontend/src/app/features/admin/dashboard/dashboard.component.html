<div class="admin-page">
  <app-admin-welcome-banner
    [firstName]="adminFirstName"
    [pendingCount]="pendingCount">
  </app-admin-welcome-banner>

  <app-admin-page-header
    title="Tableau de Bord"
    accent="FTN"
    subtitle="Vue d'ensemble de la fédération et monitoring en temps réel.">
    <div actions>
      <button type="button" class="admin-btn admin-btn--ghost" (click)="refresh()" [disabled]="refreshing || statsLoading">
        <i class="bi bi-arrow-clockwise" [class.spin]="refreshing"></i>
        Actualiser
      </button>
      <a class="admin-btn admin-btn--primary" routerLink="/admin/utilisateurs">
        <i class="bi bi-person-plus"></i>
        Nouvel utilisateur
      </a>
    </div>
  </app-admin-page-header>

  <!-- Stats -->
  <section class="admin-stats-row admin-stats-row--stagger" *ngIf="!statsLoading">
    <app-admin-stat-card
      *ngFor="let stat of stats; let i = index"
      [label]="stat.label"
      [value]="stat.value"
      [detail]="stat.detail"
      [variant]="stat.color"
      [icon]="statIcon(stat.icon)"
      [clickable]="true"
      [highlight]="stat.icon === 'pending' && pendingCount > 0"
      (cardClick)="onStatNavigate(i)">
    </app-admin-stat-card>
  </section>

  <section class="admin-stats-row" *ngIf="statsLoading">
    <div *ngFor="let _ of [1,2,3,4]" class="admin-stat-skeleton">
      <app-admin-skeleton height="14px" width="55%"></app-admin-skeleton>
      <app-admin-skeleton height="32px" width="40%" [style.margin-top.px]="12"></app-admin-skeleton>
      <app-admin-skeleton height="12px" width="70%" [style.margin-top.px]="12"></app-admin-skeleton>
    </div>
  </section>

  <!-- Grille principale -->
  <div class="dashboard-main-grid">
    <app-admin-panel title="Activité des inscriptions" [noPadding]="true">
      <app-dashboard-activity #activityChart></app-dashboard-activity>
    </app-admin-panel>

    <app-admin-panel title="Activités récentes">
      <div class="admin-activity-list" *ngIf="recentActivities.length; else noActivity">
        <article class="admin-activity-item" *ngFor="let act of recentActivities">
          <div class="admin-activity-item__icon" [ngClass]="'admin-activity-item__icon--' + act.type">
            <i class="bi" [ngClass]="{
              'bi-person-plus': act.type === 'user',
              'bi-file-earmark-check': act.type === 'license',
              'bi-cpu': act.type === 'system'
            }"></i>
          </div>
          <div class="admin-activity-item__body">
            <div class="admin-activity-item__head">
              <span class="admin-activity-item__title">{{ act.title }}</span>
              <span class="admin-activity-item__time">{{ act.time }}</span>
            </div>
            <p class="admin-activity-item__desc">{{ act.description }}</p>
          </div>
        </article>
      </div>
      <ng-template #noActivity>
        <app-admin-empty-state
          icon="bi-clock-history"
          title="Aucune activité récente"
          message="Les dernières inscriptions et licences apparaîtront ici.">
        </app-admin-empty-state>
      </ng-template>
    </app-admin-panel>
  </div>

  <!-- Alerte inscriptions en attente -->
  <section class="admin-insights" *ngIf="!statsLoading && pendingCount > 0">
    <div class="admin-insight-card admin-insight-card--warning">
      <i class="bi bi-exclamation-circle"></i>
      <div>
        <strong>{{ pendingCount }} inscription(s)</strong> nécessitent votre attention.
        <a routerLink="/admin/utilisateurs" class="admin-insight-link">Traiter maintenant</a>
      </div>
    </div>
  </section>

  <!-- Liens rapides -->
  <section class="admin-quick-links">
    <a class="admin-quick-link" routerLink="/admin/utilisateurs">
      <span class="admin-quick-link__icon"><i class="bi bi-people"></i></span>
      <span class="admin-quick-link__label">Gérer les utilisateurs</span>
    </a>
    <a class="admin-quick-link" routerLink="/admin/licences">
      <span class="admin-quick-link__icon"><i class="bi bi-card-list"></i></span>
      <span class="admin-quick-link__label">Gestion des licences</span>
    </a>
    <a class="admin-quick-link" routerLink="/admin/clubs">
      <span class="admin-quick-link__icon"><i class="bi bi-building"></i></span>
      <span class="admin-quick-link__label">Gestion des clubs</span>
    </a>
    <a class="admin-quick-link" routerLink="/admin/partenariats">
      <span class="admin-quick-link__icon"><i class="bi bi-handshake"></i></span>
      <span class="admin-quick-link__label">Partenariats & Sponsoring</span>
    </a>
    <a class="admin-quick-link">
      <span class="admin-quick-link__icon"><i class="bi bi-trophy"></i></span>
      <span class="admin-quick-link__label">Compétitions</span>
    </a>
    <a class="admin-quick-link" routerLink="/admin/mon-profil">
      <span class="admin-quick-link__icon"><i class="bi bi-shield-check"></i></span>
      <span class="admin-quick-link__label">Sécurité & profil</span>
    </a>
  </section>
</div>
