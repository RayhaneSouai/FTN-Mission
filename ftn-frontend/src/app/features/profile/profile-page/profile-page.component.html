<div class="rich-container p-4 animate__animated animate__fadeIn" *ngIf="user">
  <div class="row">
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-4">
        <div class="position-relative d-inline-block mx-auto mb-3">
          <img [src]="'https://ui-avatars.com/api/?name=' + user?.firstName + '+' + user?.lastName + '&background=random&size=128&color=fff'" 
               class="rounded-circle shadow" width="120" height="120" alt="Avatar">
          <button class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0 p-2 shadow-sm border-white border-2">
            <i class="bi bi-camera"></i>
          </button>
        </div>
        <h4 class="fw-bold text-dark mb-1">{{ user?.firstName }} {{ user?.lastName }}</h4>
        <p class="text-muted small mb-3">{{ user?.email }}</p>
        <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary px-3 py-2 mb-3">
          {{ user?.role }}
        </span>
        <div class="border-top pt-3 mt-3">
          <div class="row text-start g-2">
            <div class="col-6">
              <small class="text-muted d-block">Statut</small>
              <span class="fw-bold text-success" *ngIf="user?.active"><i class="bi bi-check-circle-fill me-1"></i> Actif</span>
              <span class="fw-bold text-danger" *ngIf="!user?.active"><i class="bi bi-x-circle-fill me-1"></i> Inactif</span>
            </div>
            <div class="col-6 text-end">
              <small class="text-muted d-block">ID #</small>
              <span class="fw-bold text-dark">{{ user?.id }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white border-bottom p-4">
          <h5 class="fw-bold mb-0">Informations Personnelles</h5>
          <p class="text-muted small mb-0">Gérez vos informations de compte</p>
        </div>
        <div class="card-body p-4">
          <div *ngIf="error" class="alert alert-danger border-0 rounded-3 mb-4 d-flex align-items-center">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            {{ error }}
          </div>
          <div *ngIf="success" class="alert alert-success border-0 rounded-3 mb-4 d-flex align-items-center">
            <i class="bi bi-check-circle-fill me-2"></i>
            {{ success }}
          </div>

          <form (ngSubmit)="saveProfile()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted text-uppercase">Prénom</label>
                <input type="text" class="form-control rounded-3" [(ngModel)]="user.firstName" name="firstName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted text-uppercase">Nom</label>
                <input type="text" class="form-control rounded-3" [(ngModel)]="user.lastName" name="lastName" required>
              </div>
              <div class="col-md-12">
                <label class="form-label fw-bold small text-muted text-uppercase">Email</label>
                <input type="email" class="form-control rounded-3" [(ngModel)]="user.email" name="email" required readonly>
                <div class="form-text small">L'email ne peut pas être modifié.</div>
              </div>
              
              <div class="col-md-6" *ngIf="user?.birthDate">
                <label class="form-label fw-bold small text-muted text-uppercase">Date de naissance</label>
                <input type="date" class="form-control rounded-3" [(ngModel)]="user.birthDate" name="birthDate">
              </div>
              
              <div class="col-md-6" *ngIf="user?.gender">
                <label class="form-label fw-bold small text-muted text-uppercase">Genre</label>
                <select class="form-select rounded-3" [(ngModel)]="user.gender" name="gender">
                  <option value="HOMME">Homme</option>
                  <option value="FEMME">Femme</option>
                </select>
              </div>
            </div>

            <div class="mt-4 pt-4 border-top text-end">
              <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-bold" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Enregistrer les modifications
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
